services:
  backend:
    build: ./backend
    container_name: rps-backend
    volumes:
      - ./backend/checkpoints:/app/checkpoints:ro
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rps-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped